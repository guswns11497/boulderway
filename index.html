let db=load();for(const g of initialMappedGyms){if(!db.gyms.some(x=>x.id===g.id))db.gyms.push(clone(g))}if(!db.homeLocation)db.homeLocation=null;let tab='home',selectedGym='wave',selectedProblem=null,shopCategory='all',entryDate=new Date().toLocaleDateString('sv-SE'),calendarMonth=entryDate.slice(0,7),calendarSelected=entryDate,mapRegion='서울 강서구',mapSort='default',leafletMap=null,expandedGym=null,hoursDate=new Date().toLocaleDateString('sv-SE');

function visitDates(){const result=new Map();for(const sess of db.sessions){const hasRecord=db.problems.some(p=>p.sessionId===sess.id)||db.logs.some(l=>l.sessionId===sess.id);if(!hasRecord||!dateOK(sess.date))continue; if(!result.has(sess.date))result.set(sess.date,new Set());result.get(sess.date).add(sess.gymId)}return result}
function sessionRecords(day){const sessions=db.sessions.filter(s=>s.date===day);const result=[];for(const s of sessions){const ids=new Set([...db.problems.filter(p=>p.sessionId===s.id).map(p=>p.id),...db.logs.filter(l=>l.sessionId===s.id).map(l=>l.problemId)]);if(!ids.size)continue;result.push({session:s,items:[...ids].map(pid=>{const p=problem(pid);if(!p)return null;const ev=db.logs.filter(l=>l.problemId===pid&&l.sessionId===s.id).slice(-1)[0];return {p,event:ev}}).filter(Boolean)})}return result}
function calendar(){const parts=calendarMonth.split('-').map(Number),y=parts[0],m=parts[1];const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),visits=visitDates(),slots=[];for(let i=0;i<first;i++)slots.push(null);for(let d=1;d<=days;d++)slots.push(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`);const detail=sessionRecords(calendarSelected);return `<div class="card"><div class="calbar"><h2>방문 캘린더</h2><div class="calcontrols"><button class="btn alt mini" data-action="calendar-prev" aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button class="btn alt mini" data-action="calendar-next" aria-label="다음 달">›</button></div></div><p class="muted">암장을 방문한 날짜에는 이름이 은은하게 표시돼요. 날짜를 누르면 그날의 기록을 볼 수 있어요.</p><div class="calendar">${['일','월','화','수','목','금','토'].map(t=>`<div class="weekday">${t}</div>`).join('')}${slots.map(day=>{if(!day)return '<div class="calblank"></div>';const ids=[...(visits.get(day)||[])],names=ids.map(gid=>(gym(gid)?.name||'암장').replace(' (예시 암장)',''));return `<button class="calday ${day===calendarSelected?'selected':''} ${day===today()?'today':''} ${ids.length?'visited':''}" data-action="calendar-day" data-date="${day}" aria-label="${day} ${names.join(', ')}"><span class="calnum">${Number(day.slice(-2))}</span>${names.length?`<span class="calmark">${h(names.slice(0,2).join(' · '))}</span>`:''}</button>`}).join('')}</div><div class="line"></div><div class="listhead"><h3>${h(calendarSelected)} 등반 기록</h3><button class="btn alt mini" data-action="calendar-record">이 날짜 기록 ＋</button></div>${detail.length?detail.map(({session,items})=>`<div class="day-group"><b>${h(gym(session.gymId)?.name||'암장')}</b>${items.map(({p,event})=>`<div class="listitem listhead"><div class="small">${mark(gym(p.gymId),p.grade)} · ${h(p.name)}<div class="muted">${h(problemDescriptor(p))}</div><div class="muted">${h(event?statusName[event.status]:'등반 중')}</div></div><button class="btn alt mini" data-action="open-problem" data-id="${h(p.id)}">보기</button></div>`).join('')}</div>`).join(''):'<div class="empty">이 날짜에는 기록이 없어요.</div>'}</div>`}
function home(){let s=stats(),open=db.problems.filter(p=>completed(p)==='retry');return `<div class="notice">BoulderWay 베타는 <b>이 기기 브라우저에만 저장</b>돼요. 회원 간 통계와 온라인 동기화는 아직 지원하지 않습니다.</div><div class="card"><h2>오늘의 클라이밍 기록</h2><p class="muted">오늘 기록을 바로 남겨요. 어제 운동했다면 날짜를 바꿔도 돼요.</p><div class="field"><label for="home-date">운동한 날짜</label><input id="home-date" type="date" value="${h(entryDate)}"></div><div class="field"><label for="home-gym">방문 암장</label><select id="home-gym">${db.gyms.map(g=>`<option value="${h(g.id)}" ${selectedGym===g.id?'selected':''}>${h(g.name)}</option>`).join('')}</select></div><button class="btn wide" data-action="home-start">＋ 이 날짜에 등반 기록하기</button></div><div class="card"><h2>내 클라이밍 기록</h2><div class="statgrid"><div class="stat"><div class="count">${s.visits}</div><label>운동 세션</label></div><div class="stat"><div class="count">${s.completed}</div><label>완등 문제</label></div><div class="stat"><div class="count">${s.retry}</div><label>재등 예정</label></div></div></div>${calendar()}<div class="card"><h2>이어 할 프로젝트</h2>${open.length?open.map(p=>problemRow(p,true)).join(''):'<div class="empty">재등 예정인 문제가 없어요.</div>'}</div><div class="card"><h2>빠른 길찾기</h2><button class="btn alt wide" data-action="go-gyms">암장 찾기 →</button></div>`}
function isCoord(g){return Number.isFinite(Number(g.lat))&&Number.isFinite(Number(g.lng))&&g.lat!==null&&g.lng!==null}
function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dLat=r(Number(b.lat)-Number(a.lat)),dLon=r(Number(b.lng)-Number(a.lng));const z=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;return Math.round(2*R*Math.atan2(Math.sqrt(z),Math.sqrt(1-z))*10)/10}
function regionMatched(g){const q=mapRegion.trim().replace(/\s+/g,'');return !q||(g.region||g.address||'').replace(/\s+/g,'').includes(q)||g.name.replace(/\s+/g,'').includes(q)}
function listedGyms(){const list=db.gyms.filter(regionMatched);if(mapSort==='near'&&db.homeLocation)list.sort((a,b)=>(isCoord(a)?dist(db.homeLocation,a):Infinity)-(isCoord(b)?dist(db.homeLocation,b):Infinity));return list}
function gyms(){const list=listedGyms();const homeLoc=db.homeLocation;return `<div class="card"><h2>암장 지도</h2><p class="muted">집 위치를 이 기기에 저장하고 가까운 암장을 찾아보세요. 현재 지도는 등록된 암장만 표시합니다.</p><div class="regionline"><input id="region-query" placeholder="지역 입력 · 예: 서울 강서구" value="${h(mapRegion)}"><button class="btn alt mini" data-action="region-search">지역 검색</button></div><div class="chiprow topspace"><button class="chip" data-action="region-preset" data-region="서울 강서구">서울 강서구</button><button class="chip" data-action="region-preset" data-region="">전체 보기</button><button class="chip ${mapSort==='near'?'active':''}" data-action="sort-near">집에서 가까운 순</button></div><div id="gym-map"><div class="map-placeholder">지도 불러오는 중…</div></div><p class="footer-note">지도 오류 시 아래 암장 목록의 카카오맵 길찾기를 이용할 수 있어요. 지도: © OpenStreetMap 기여자. 지도 타일은 인터넷 연결이 필요해요. 위치는 근사한 건물 좌표이며 출입구와 다를 수 있어요.</p></div><div class="card"><h2>내 출발 위치</h2>${homeLoc?`<p class="muted">저장된 위치: ${h(homeLoc.label||'내 위치')} · 위도 ${Number(homeLoc.lat).toFixed(4)}, 경도 ${Number(homeLoc.lng).toFixed(4)}</p>`:'<p class="muted">아직 저장된 위치가 없어요. 정확한 집 주소 입력은 필요하지 않아요.</p>'}<div class="map-controls"><button class="btn alt mini" data-action="save-current-home">⌖ 현재 위치 저장</button><button class="btn alt mini" data-action="pick-home">⌖ 지도에서 위치 선택</button>${homeLoc?'<button class="btn danger mini" data-action="clear-home">삭제</button>':''}</div><p class="footer-note">지도 위치 선택을 누른 뒤 원하는 지점을 지도에서 터치하면 출발지로 저장돼요. 현재 위치 사용은 브라우저에서 권한을 허용해야 해요. 저장 위치는 이 브라우저에만 보관해요.</p></div><div class="card"><h2>암장 목록 · ${list.length}곳</h2>${list.length?list.map(g=>gymRow(g)).join(''):'<div class="empty">해당 지역에서 등록된 암장을 찾지 못했어요. 다른 지역을 입력하거나 직접 추가해 주세요.</div>'}</div><div class="card"><h2>암장 직접 추가</h2><p class="muted">암장명·주소만 넣으면 검색 연결이 가능해요. 지도에 정확히 표시하려면 위도·경도도 입력해야 해요.</p><div class="field"><label>암장 이름</label><input id="new-gym" maxlength="50" placeholder="예: ○○클라이밍"></div><div class="field"><label>주소</label><input id="new-address" maxlength="100" placeholder="예: 서울특별시 ..."></div><div class="field"><label>지역</label><input id="new-region" maxlength="40" value="${h(mapRegion)}" placeholder="예: 서울 강서구"></div><div class="map-controls"><div class="field" style="flex:1"><label>위도 (선택)</label><input id="new-lat" type="number" step="any" placeholder="37.56"></div><div class="field" style="flex:1"><label>경도 (선택)</label><input id="new-lng" type="number" step="any" placeholder="126.83"></div></div><button class="btn alt wide" data-action="add-gym">암장 추가</button></div>`}
const DAY_NAMES=['일','월','화','수','목','금','토'];
function getSchedule(g,date){const d=new Date(date+'T12:00:00');if(Number.isNaN(d.getTime()))return null;const day=d.getDay(),key=day===0?'sun':day===6?'sat':'weekday';return {key,weekday:DAY_NAMES[day],value:g.hours?.[key]||null};}
function scheduleText(v){if(!v)return '운영시간 미등록';if(v.closed)return '휴무';return v.open&&v.close?`${v.open} ~ ${v.close}`:'운영시간 미등록';}
function hoursPanel(g){const day=getSchedule(g,hoursDate),value=day?.value;const schedule=g.hours||{};return `<div class="hours-panel"><div class="listhead"><h3>${h(g.name)} 운영시간</h3><button class="btn alt mini" data-action="close-hours">닫기</button></div><label for="hours-date">방문할 날짜</label><input id="hours-date" type="date" value="${h(hoursDate)}"><div class="hours-result"><b>${day?`${day.weekday}요일 · ${scheduleText(value)}`:'날짜를 선택해 주세요'}</b><div class="muted">평일 / 토요일 / 일요일을 구분해 보여줘요.</div></div><details><summary>운영시간 등록·수정</summary><p class="muted small">공식 운영시간을 확인한 뒤 입력해 주세요. 입력 내용은 이 브라우저에만 저장돼요.</p>${[['weekday','평일 (월~금)'],['sat','토요일'],['sun','일요일']].map(([key,label])=>{const v=schedule[key]||{};return `<div class="hours-edit"><b>${label}</b><select id="hours-mode-${key}"><option value="unknown" ${!v.closed&&!(v.open&&v.close)?'selected':''}>미등록</option><option value="open" ${!v.closed&&v.open&&v.close?'selected':''}>운영</option><option value="closed" ${v.closed?'selected':''}>휴무</option></select><div class="hours-times"><input type="time" aria-label="${label} 시작" id="hours-open-${key}" value="${h(v.open||'')}"/><span>~</span><input type="time" aria-label="${label} 종료" id="hours-close-${key}" value="${h(v.close||'')}"/></div></div>`}).join('')}<button class="btn wide" data-action="save-hours" data-id="${h(g.id)}">운영시간 저장</button></details><p class="footer-note">공휴일·임시휴무는 별도일 수 있어요. 방문 전 공식 공지를 확인해 주세요.</p></div>`}
function gymRow(g){const distance=db.homeLocation&&isCoord(g)?`<span class="distance">직선거리 ${dist(db.homeLocation,g)}km</span>`:'';return `<div class="listitem" data-gymname="${h(g.name.toLowerCase())}"><div class="listhead"><div><b>${h(g.name)}</b><div class="muted">${h(g.address||'주소 미등록')}</div>${distance}${g.note?`<div class="muted">※ ${h(g.note)}</div>`:''}</div><button class="btn alt mini" data-action="select-gym" data-id="${h(g.id)}">기록</button></div><div class="flex topspace"><button class="btn alt mini" data-action="navigate-gym" data-id="${h(g.id)}">↗ 길찾기</button><button class="btn alt mini" data-action="focus-gym" data-id="${h(g.id)}">지도 위치</button><button class="btn alt mini" data-action="set-grades" data-id="${h(g.id)}">그레이드</button><button class="btn alt mini" data-action="set-walls" data-id="${h(g.id)}">벽 설정</button><button class="btn mini" data-action="show-hours" data-id="${h(g.id)}">운영시간</button></div>${expandedGym===g.id?hoursPanel(g):""}</div>`}
function showFallbackMap(message='온라인 배경지도를 불러오지 못했어요.'){
 const div=$('gym-map');if(!div)return;
 const gyms=listedGyms().filter(isCoord);
 if(!gyms.length){div.innerHTML='<div class="map-placeholder">표시할 암장이 없어요. 지역을 변경하거나 암장을 추가해 주세요.</div>';return;}
 let pts=gyms.map(g=>({g,lat:Number(g.lat),lng:Number(g.lng)}));
 if(db.homeLocation)pts.push({g:null,lat:Number(db.homeLocation.lat),lng:Number(db.homeLocation.lng)});
 const lats=pts.map(x=>x.lat),lngs=pts.map(x=>x.lng);
 const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLng=Math.min(...lngs),maxLng=Math.max(...lngs);
 const latRange=Math.max(maxLat-minLat,0.008),lngRange=Math.max(maxLng-minLng,0.013);
 const project=x=>({left:(12+76*(x.lng-minLng)/lngRange).toFixed(2)+'%',top:(15+66*(maxLat-x.lat)/latRange).toFixed(2)+'%'});
 div.innerHTML=`<div class="map-fallback" aria-label="암장 좌표 기반 위치 안내"><div class="map-fallback-title">📍 암장 위치 안내 <span class="muted">(배경지도 미표시)</span></div><div class="map-schematic">${pts.map(x=>{const xy=project(x);return `<button type="button" class="map-pin-fallback ${x.g?'':'map-home-fallback'}" style="left:${xy.left};top:${xy.top}" data-action="${x.g?'show-hours':'noop'}" ${x.g?`data-id="${h(x.g.id)}"`:''} title="${h(x.g?.name||'저장한 출발지')}">${h(x.g?.symbol||x.g?.name||'🏠 내 위치')}</button>`}).join('')}</div><div class="muted" style="margin-top:9px">${h(message)} 표시 위치는 위경도의 상대적 배치이며 실제 도로 지도가 아니에요. 정확한 경로는 아래 '길찾기'를 이용하세요.</div></div>`;
}
function initMap(){
 const div=$('gym-map');if(!div)return;
 if(leafletMap){try{leafletMap.remove()}catch(e){}leafletMap=null}
 if(location.protocol==='file:'){showFallbackMap('HTML 파일 직접 실행에서는 지도 서버 요청이 차단될 수 있어요. 무료 웹사이트 주소로 접속하거나 카카오맵 길찾기를 이용해 주세요.');return}
 if(!window.L){showFallbackMap('지도 라이브러리 연결 실패 또는 오프라인 상태입니다.');return}
 try{
  leafletMap=L.map(div,{scrollWheelZoom:false}).setView([37.565,126.835],12);
  let tilesLoaded=false,failed=0;
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:19,referrerPolicy:'strict-origin-when-cross-origin',updateWhenIdle:true,keepBuffer:1});
  tiles.on('tileload',()=>{tilesLoaded=true});
  tiles.on('tileerror',()=>{failed++;if(failed>=3&&!tilesLoaded){try{leafletMap?.remove()}catch(e){}leafletMap=null;showFallbackMap('지도 타일 서버 연결에 실패했습니다.')}});
  tiles.addTo(leafletMap);
  const bounds=[];
  for(const g of listedGyms()){
   if(!isCoord(g))continue;

   const icon=L.divIcon({className:'',html:`<div class="maplogo">${h(g.symbol||g.name)}</div>`,iconSize:[88,34],iconAnchor:[44,16]});
   L.marker(x,{icon}).addTo(leafletMap).bindPopup(`<b>${h(g.name)}</b><br>${h(g.address||'')}<br><span>${h(scheduleText(getSchedule(g,hoursDate)?.value))} (${h(getSchedule(g,hoursDate)?.weekday||'')}요일 기준)</span><br><button class="popup-hours" data-action="show-hours" data-id="${h(g.id)}">요일별 운영시간 보기</button><br><a href="${h(gymLink(g))}" target="_blank" rel="noopener">카카오맵 길찾기 ↗</a>`)
  }
  if(db.homeLocation){const pt=[Number(db.homeLocation.lat),Number(db.homeLocation.lng)];bounds.push(pt);L.marker(pt,{icon:L.divIcon({className:'',html:'<div class="maplogo home">내 출발지</div>',iconSize:[78,34],iconAnchor:[39,16]})}).addTo(leafletMap)}
  if(bounds.length>1)leafletMap.fitBounds(bounds,{padding:[42,42],maxZoom:14});else if(bounds.length===1)leafletMap.setView(bounds[0],13);
  leafletMap.on('click',e=>{if(!pickingHome)return;pickingHome=false;if(!confirm('선택한 지도 위치를 내 출발지로 저장할까요?'))return;db.homeLocation={lat:e.latlng.lat,lng:e.latlng.lng,label:'지도에서 선택한 위치'};save();render();flash('출발지가 저장됐어요.')});
  setTimeout(()=>{if($('gym-map')===div&&leafletMap&&!tilesLoaded){try{leafletMap.remove()}catch(e){}leafletMap=null;showFallbackMap('지도 서버 응답이 지연되거나 차단되었습니다.')}},5000);
 }catch(e){try{leafletMap?.remove()}catch(err){}leafletMap=null;showFallbackMap('온라인 지도 초기화 오류가 발생했습니다.')}
}
let pickingHome=false;
function gymLink(g){if(isCoord(g)){const target=`${encodeURIComponent(g.name)},${g.lat},${g.lng}`;if(db.homeLocation){const home=db.homeLocation;return `https://map.kakao.com/link/by/traffic/${encodeURIComponent('내 출발지')},${home.lat},${home.lng}/${target}`}return `https://map.kakao.com/link/to/${target}`}return 'https://map.kakao.com/link/search/'+encodeURIComponent(g.name+' '+(g.address||''))}
function problemRow(p,canOpen=false){let g=gym(p.gymId),v=completed(p);return `<div class="listitem"><div class="listhead"><div><b>${mark(g,p.grade)} · ${h(p.name)}</b><div class="muted">${h(g?.name||'삭제된 암장')} · ${h(p.setup||'세팅 날짜 미지정')}</div></div><span class="pill ${v==='complete'?'done':v==='failed'?'fail':'retry'}">${v==='complete'?'완등':v==='failed'?'실패·포기':v==='retry'?'재등 예정':'등반 중'}</span></div><div class="topspace"><button class="btn alt mini" data-action="open-problem" data-id="${h(p.id)}">${canOpen?'이어하기':'기록 확인'} →</button></div></div>`}
function log(){if(selectedProblem){let p=problem(selectedProblem);if(p)return detail(p);selectedProblem=null}let g=gym(selectedGym)||db.gyms[0];let list=db.problems.filter(p=>p.gymId===g.id);return `<div class="card"><h2>등반 기록</h2><div class="field"><label for="log-date">운동 날짜 (지난 날짜도 가능)</label><input id="log-date" type="date" value="${h(entryDate)}"></div><div class="field"><label>암장 선택</label><select id="log-gym">${db.gyms.map(x=>`<option value="${h(x.id)}" ${x.id===g.id?'selected':''}>${h(x.name)}</option>`).join('')}</select></div><div class="field"><label>벽 이름</label><select id="log-wall">${wallsOf(g).map(x=>`<option value="${h(x)}">${h(x)}</option>`).join('')}</select></div><div class="field"><label>홀드 색상 (실제 홀드 색)</label><div class="chiprow" id="hold-picker">${holdPalette.map((x,i)=>`<button type="button" class="chip ${i===0?'active':''}" data-action="hold-select" data-hold="${h(x[0])}" aria-pressed="${i===0?'true':'false'}"><span class="color" style="background:${x[1]}"></span>${h(x[0])}</button>`).join('')}</div><input id="log-hold" type="hidden" value="빨강"></div><div class="field"><label>그레이드 (테이프 색상)</label><select id="log-grade">${g.grades.map(x=>`<option value="${h(x[0])}">${h(x[0])}</option>`).join('')}</select></div><div class="field"><label>같은 색 홀드 문제 구분 (선택)</label><input id="problem-name" maxlength="55" placeholder="예: 왼쪽, 2번, 출발 홀드 아래"></div><div class="field"><label>세팅 시작일 (선택 · 이전 세팅과 구분)</label><input id="setup-date" type="date"></div><button class="btn wide" data-action="create-problem">＋ 이 문제 기록 시작</button><p class="footer-note">같은 문제가 이미 있다면 아래 목록에서 열어주세요. 벽·홀드 색·그레이드를 선택하세요. 같은 벽에 같은 홀드 색 문제가 여러 개면 구분 이름을 추가해 주세요. 검증되지 않은 문제는 자동 병합하지 않아요.</p></div><div class="card"><h2>등록된 문제 · ${list.length}</h2>${list.length?list.map(p=>problemRow(p)).join(''):'<div class="empty">아직 문제가 없어요. 위에서 첫 문제를 등록해 보세요.</div>'}</div>`}
const statusName={active:'등반 중',retry:'재등 예정',complete:'완등',failed:'실패 · 포기'};
function detail(p){let g=gym(p.gymId),hist=db.logs.filter(l=>l.problemId===p.id),v=completed(p),liveSession=db.sessions.find(s=>s.id===p.sessionId);let rev=db.reviews[p.id]||{};return `<div class="card"><button class="btn alt mini" data-action="close-detail">← 문제 목록</button><h2 style="margin-top:15px">${mark(g,p.grade)} · ${h(p.name)}</h2><p class="muted">${h(problemDescriptor(p))} · ${h(g?.name||'암장')} ${p.setup?'· 세팅 '+h(p.setup):''}</p><div class="statgrid"><div class="stat"><div class="count">${hist.filter(x=>x.status==='retry').length+1}</div><label>진행 세션*</label></div><div class="stat"><div style="padding-top:8px;font-weight:800">${h(statusName[v])}</div><label>현재 상태</label></div><div class="stat"><div class="count">${hist.length}</div><label>기록 이벤트</label></div></div><p class="footer-note">*시작 세션 포함, 재등 예정으로 넘긴 횟수를 기준으로 표시합니다. 다음 결과를 누르면 다음 방문에서 이어 하면 새 세션으로 기록돼요.</p><div class="line"></div>${v==='active'||v==='retry'?`<h3>이번 문제 결과</h3><div class="field"><label for="detail-date">이번에 등반한 날짜</label><input type="date" id="detail-date" value="${h(entryDate)}"></div><div class="flex"><button class="btn mini" data-action="record" data-status="complete">✓ 완등</button><button class="btn danger mini" data-action="record" data-status="failed">× 실패</button><button class="btn alt mini" data-action="record" data-status="retry">↻ 재등 예정</button></div><p class="muted">재등 예정은 현재 상태를 저장하고 다음 세션에서 이어갈 수 있어요.</p>`:`<div class="notice">${v==='complete'?'완등했어요! 이 문제의 세션 진행은 종료됐습니다.':'포기로 기록했어요. 이어하기 목록에서 제외됩니다.'} 실수였다면 마지막 기록을 취소하세요.</div>`}<div class="flex"><button class="btn alt mini" data-action="undo">↶ 마지막 선택 취소</button><button class="btn danger mini" data-action="reset">전체 초기화</button></div></div><div class="card"><h2>나의 체감 난이도 (선택)</h2><div class="rating">${['🍯 꿀','🙂 쉬움','😐 보통','🥵 매움','🔥 대장'].map((x,i)=>`<button data-action="rate" data-score="${i+1}" class="${rev.rating===i+1?'active':''}">${i+1}<br>${x}</button>`).join('')}</div><div class="line"></div><h3>문제 특징 (선택)</h3><div class="chiprow">${['근력 필요','점프·다이노','밸런스','유연성','테크닉','지구력','리치 중요','크림프'].map(x=>`<button class="chip ${(rev.tags||[]).includes(x)?'active':''}" data-action="tag" data-tag="${h(x)}">${h(x)}</button>`).join('')}</div><p class="footer-note">현재는 내 평가만 저장합니다. 다수 사용자 집계는 서버 연결 후 제공해요.</p></div><div class="card"><h2>기록 이력</h2>${hist.length?hist.map((x,i)=>`<div class="listitem small">${i+1}. ${h(statusName[x.status])} <span class="muted">· ${h(x.date)}</span></div>`).join(''):'<div class="empty">아직 기록이 없어요.</div>'}</div>`}

function completedByGym(){const result=[];for(const g of db.gyms){const counts=new Map();for(const p of db.problems){if(p.gymId!==g.id||completed(p)!=='complete')continue;counts.set(p.grade,(counts.get(p.grade)||0)+1)}const ordered=[...g.grades.map(x=>x[0]).filter(x=>counts.has(x)),...Array.from(counts.keys()).filter(x=>!g.grades.some(y=>y[0]===x))];if(ordered.length)result.push({g,items:ordered.map(grade=>({grade,count:counts.get(grade)}))})}return result}
function totalCard(){const rows=completedByGym();return `<div class="card"><h2>암장별 누적 완등</h2><p class="muted">암장마다 그레이드별로 완등한 고유 문제 수를 합산해요. 여러 세션에서 이어 풀어도 한 번만 계산합니다.</p>${rows.length?rows.map(({g,items})=>`<div class="gym-summary"><h3>${h(g.name)} <span class="muted">총 ${items.reduce((n,x)=>n+x.count,0)}문제</span></h3><div class="grade-grid">${items.map(({grade,count})=>`<div class="grade-total"><span class="small">${mark(g,grade)}</span><strong>${count}<span class="muted">개</span></strong></div>`).join('')}</div></div>`).join('<div class="line"></div>'):'<div class="empty">완등한 문제가 생기면 암장별 누적 개수가 여기에 표시됩니다.</div>'}<p class="footer-note">완등을 취소하거나 문제 기록을 초기화하면 누적 수치도 자동 변경됩니다. 이 기기에 저장된 기록만 집계해요.</p></div>`}
function my(){let s=stats();return `<div class="card"><h2>내 활동</h2><div class="statgrid"><div class="stat"><div class="count">${s.visits}</div><label>세션</label></div><div class="stat"><div class="count">${s.completed}</div><label>완등</label></div><div class="stat"><div class="count">${s.retry}</div><label>재등</label></div></div></div>${totalCard()}<div class="card"><h2>운동 세션 목록</h2>${db.sessions.length?db.sessions.slice().reverse().map(s=>`<div class="listitem small"><b>${h(s.date)}</b> · ${h(gym(s.gymId)?.name||'암장')}<span class="muted"> (${h(s.id.slice(0,6))})</span></div>`).join(''):'<div class="empty">아직 운동 세션이 없어요.</div>'}</div><div class="card"><h2>내 데이터</h2><button class="btn alt wide" data-action="export">↓ JSON 백업 내려받기</button><div class="topspace"><label class="btn alt wide" style="display:block;text-align:center;cursor:pointer">↑ 백업 복원하기 <input id="import-file" type="file" accept="application/json,.json" style="display:none"></label></div><p class="footer-note">데이터는 이 브라우저 내부에만 저장됩니다. 브라우저 데이터를 삭제하거나 기기를 변경하면 기록을 잃을 수 있으니 백업하세요. 회원가입·공용 통계·클라우드 복원은 다음 개발 단계입니다.</p></div>`}
function createSession(gymId,forceNew=false){let d=entryDate;if(!forceNew){let old=db.sessions.findLast(s=>s.gymId===gymId&&s.date===d);if(old)return old}let s={id:id(),gymId,date:d,createdAt:new Date().toISOString()};db.sessions.push(s);return s}
function action(a,el){let p=problem(selectedProblem);if(a==='calendar-prev'||a==='calendar-next'){const [y,m]=calendarMonth.split('-').map(Number);const d=new Date(y,m-1+(a==='calendar-prev'?-1:1),1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');calendarSelected=calendarMonth+'-01';return render()}if(a==='calendar-day'){calendarSelected=el.dataset.date;return render()}if(a==='calendar-record'){entryDate=calendarSelected;selectedProblem=null;return navigate('log')}if(a==='home-start'){const d=$('home-date').value;if(!dateOK(d))return flash('올바른 날짜를 선택해 주세요.');entryDate=d;selectedGym=$('home-gym').value;selectedProblem=null;return navigate('log')}if(a==='shop-filter'){shopCategory=el.dataset.kind;return render()}if(a==='shop-add'){const name=$('shop-name').value.trim(),url=safeShopUrl($('shop-url').value.trim()),type=$('shop-type').value;if(!name||!url||!['gear','wear'].includes(type))return flash('브랜드명과 올바른 http(s) 주소를 입력해주세요.');db.customShops??=[];db.customShops.push({id:id(),name,url,type});save();render();return flash('사이트를 추가했어요.')}if(a==='shop-delete'){if(!confirm('추가한 사이트를 삭제할까요?'))return;db.customShops=(db.customShops||[]).filter(x=>x.id!==el.dataset.id);save();return render()}if(a==='region-search'){mapRegion=$('region-query').value.trim();mapSort='default';return render()}if(a==='region-preset'){mapRegion=el.dataset.region;mapSort='default';return render()}if(a==='sort-near'){if(!db.homeLocation)return flash('먼저 집이나 출발 위치를 저장해 주세요.');mapSort=mapSort==='near'?'default':'near';return render()}if(a==='focus-gym'){const g=gym(el.dataset.id);if(!isCoord(g))return flash('좌표가 등록되지 않은 암장이에요.');leafletMap?.setView([g.lat,g.lng],16);return}if(a==='save-current-home'){if(!navigator.geolocation)return flash('위치 기능을 지원하지 않는 환경이에요.');navigator.geolocation.getCurrentPosition(pos=>{db.homeLocation={lat:pos.coords.latitude,lng:pos.coords.longitude,label:'내 현재 위치'};save();render();flash('현재 위치를 저장했어요.')},()=>flash('위치 권한 또는 보안 연결을 확인해 주세요.'),{enableHighAccuracy:false,timeout:12000});return}if(a==='pick-home'){if(!window.L)return flash('지도 연결 후 선택할 수 있어요.');pickingHome=true;flash('지도에서 출발 위치를 터치해 주세요.');return}if(a==='clear-home'){if(!confirm('저장된 출발 위치를 삭제할까요?'))return;db.homeLocation=null;mapSort='default';save();return render()}if(a==='show-hours'){expandedGym=el.dataset.id;render();document.querySelector('.hours-panel')?.scrollIntoView({block:'nearest',behavior:'smooth'});return}if(a==='close-hours'){expandedGym=null;return render()}if(a==='save-hours'){const g=gym(el.dataset.id);if(!g)return;const next={};for(const key of ['weekday','sat','sun']){const mode=$('hours-mode-'+key).value;if(mode==='closed'){next[key]={closed:true};continue}if(mode==='open'){const open=$('hours-open-'+key).value,close=$('hours-close-'+key).value;if(!open||!close)return flash('운영시간의 시작과 종료를 모두 입력해 주세요.');next[key]={open,close};}}g.hours=next;save();render();return flash('운영시간이 이 기기에 저장됐어요.')}if(a==='go-log')return navigate('log');if(a==='go-gyms')return navigate('gyms');if(a==='select-gym'){selectedGym=el.dataset.id;selectedProblem=null;return navigate('log')}if(a==='close-detail'){selectedProblem=null;return render()}if(a==='open-problem'){selectedProblem=el.dataset.id;return navigate('log')}
if(a==='add-gym'){let name=$('new-gym').value.trim(),address=$('new-address').value.trim();if(!name)return flash('암장 이름을 입력해주세요.');let lat=$('new-lat').value.trim(),lng=$('new-lng').value.trim(),region=$('new-region').value.trim();if((lat||lng)&&(!lat||!lng||!Number.isFinite(Number(lat))||!Number.isFinite(Number(lng))||Math.abs(Number(lat))>90||Math.abs(Number(lng))>180))return flash('위도·경도를 모두 올바르게 입력해 주세요.');let newGym={id:id(),name,address,region,lat:lat?Number(lat):null,lng:lng?Number(lng):null,grades:clone(defaultGyms[0].grades),walls:clone(defaultWalls)};db.gyms.push(newGym);selectedGym=newGym.id;save();render();return flash('암장이 추가되었어요.')}
if(a==='set-grades'){let g=gym(el.dataset.id);let v=prompt('색상을 쉬운 순서로 쉼표(,)로 입력해주세요.',g.grades.map(x=>x[0]).join(', '));if(v===null)return;let names=v.split(',').map(x=>x.trim()).filter(Boolean);if(!names.length)return flash('색상을 하나 이상 입력해주세요.');let old=Object.fromEntries(g.grades);g.grades=names.map(n=>[n,old[n]||'#9b9b9b']);save();render();return flash('색상이 변경되었습니다.')}
if(a==='navigate-gym'){let g=gym(el.dataset.id);return window.open(gymLink(g),'_blank','noopener,noreferrer')}
if(a==='hold-select'){const val=el.dataset.hold;$('log-hold').value=val;document.querySelectorAll('#hold-picker [data-hold]').forEach(b=>{const active=b.dataset.hold===val;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});return}if(a==='set-walls'){const g=gym(el.dataset.id);if(!g)return;const v=prompt('벽 이름을 쉼표(,)로 구분해서 입력하세요.',wallsOf(g).join(', '));if(v===null)return;const list=[...new Set(v.split(',').map(x=>x.trim()).filter(Boolean))];if(!list.length)return flash('벽 이름을 하나 이상 등록해 주세요.');g.walls=list;save();render();return flash('벽 목록을 저장했어요.')}if(a==='create-problem'){let grade=$('log-grade').value,wall=$('log-wall').value,hold=$('log-hold').value,name=$('problem-name').value.trim(),setup=$('setup-date').value;if(!wall||!hold||!grade)return flash('벽, 홀드 색상, 그레이드를 선택해 주세요.');if(!name)name=wall+' · '+hold+' 홀드';const day=$('log-date')?.value;if(!dateOK(day))return flash('올바른 운동 날짜를 선택해주세요.');entryDate=day;let dup=db.problems.find(p=>p.gymId===selectedGym&&p.grade===grade&&p.name===name&&p.setup===setup&&(p.wall||'')===wall&&(p.holdColor||'')===hold);if(dup){selectedProblem=dup.id;render();return flash('이미 등록된 문제로 이동했어요.')}let s=createSession(selectedGym);let np={id:id(),gymId:selectedGym,wall,holdColor:hold,grade,name,setup,sessionId:s.id,createdAt:new Date().toISOString()};db.problems.push(np);selectedProblem=np.id;save();render();return flash('문제를 만들었어요. 결과를 선택해보세요.')}
if(!p)return;
if(a==='record'){let status=el.dataset.status;const picked=$('detail-date')?.value||entryDate;if(!dateOK(picked))return flash('날짜를 확인해주세요.');entryDate=picked;if(completed(p)==='complete'||completed(p)==='failed')return flash('종료된 문제입니다.');let last=db.logs.filter(l=>l.problemId===p.id).slice(-1)[0];let sessionId=createSession(p.gymId).id;p.sessionId=sessionId;db.logs.push({id:id(),problemId:p.id,sessionId,status,date:entryDate});save();render();return flash(statusName[status]+' 저장 완료')}
if(a==='undo'){const idx=db.logs.findLastIndex(l=>l.problemId===p.id);if(idx<0)return flash('취소할 기록이 없어요.');db.logs.splice(idx,1);save();render();return flash('마지막 선택을 취소했어요.')}
if(a==='reset'){if(!confirm('이 문제의 모든 결과와 평가를 삭제하고 다시 시작할까요?'))return;db.logs=db.logs.filter(x=>x.problemId!==p.id);delete db.reviews[p.id];save();render();return flash('문제 기록이 초기화되었어요.')}
if(a==='rate'){db.reviews[p.id]??={rating:null,tags:[]};db.reviews[p.id].rating=Number(el.dataset.score);save();render();return flash('난이도를 저장했어요.')}
if(a==='tag'){db.reviews[p.id]??={rating:null,tags:[]};let arr=db.reviews[p.id].tags??[];db.reviews[p.id].tags=arr.includes(el.dataset.tag)?arr.filter(x=>x!==el.dataset.tag):[...arr,el.dataset.tag];save();render();return}
if(a==='export'){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='boulderway-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return flash('백업 파일을 내려받았어요.')}

document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b);let n=e.target.closest('.nav button');if(n)navigate(n.dataset.tab)});document.addEventListener('change',async e=>{if(e.target.id==='hours-date'){if(dateOK(e.target.value)){hoursDate=e.target.value;render()}return}if(e.target.id==='home-date'||e.target.id==='log-date'){if(dateOK(e.target.value)){entryDate=e.target.value;if(e.target.id==='home-date')calendarSelected=entryDate;}return}if(e.target.id==='home-gym'){selectedGym=e.target.value;return}if(e.target.id==='log-gym'){selectedGym=e.target.value;render();return}if(e.target.id==='import-file'){let f=e.target.files?.[0];if(!f)return;try{const parsed=JSON.parse(await f.text());if(!parsed||!['gyms','sessions','problems','logs'].every(k=>Array.isArray(parsed[k])))throw Error('invalid');if(!confirm('현재 기기의 기록을 백업 파일로 교체할까요? 기존 데이터는 덮어써집니다.'))return;db={...parsed,reviews:parsed.reviews&&typeof parsed.reviews==='object'?parsed.reviews:{}};selectedGym=db.gyms[0]?.id;selectedProblem=null;save();navigate('home');flash('백업 복원이 완료됐어요.')}catch(err){flash('올바른 BoulderWay 백업 파일인지 확인해주세요.')}}});render();
